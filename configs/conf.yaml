version: 0.1b
name: GeoFusion
description: Configuration for Stellarator Optimization Ensemble

ml:
  device: "cuda"
  force_retrain: false
  ensemble:
    default:
      input_dim: 90
      train:
        batch_size: 256
        epochs: 15
        learning_rate: 1e-3
        layers: [1024, 512, 256, 128]
        activation: "gelu"

    models:
      qi:
        filepath: "models/qi_model.pth"
        train:
          learning_rate: 1e-4
          layers: [2048, 1024, 512, 128, 512, 256, 128, 64, 16]

      w_mhd:
        filepath: "models/w_mhd_model.pth"
        train:
          learning_rate: 1e-4
          layers: [1024, 512, 256, 128, 512, 256, 128, 32]

      mirror_ratio:
        filepath: "models/mirror_ratio_model.pth"

      iota_edge:
        filepath: "models/iota_edge_model.pth"


physics:
  n_field_periods: 3
  theta_res: 64
  phi_res: 128
  weights:
    qi: 1.0
    w_mhd: 10.0
    mirror_ratio: 2.0
    iota_edge: 5.0